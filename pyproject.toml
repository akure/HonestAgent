[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "honest-agent"
version = "0.1.0"
description = "A runtime safety gateway for AI agent tool calls."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Honest Agent Contributors" }]
dependencies = [
  "fastapi>=0.137.1,<0.138",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "httpx>=0.28,<1"]
providers = ["groq>=0.13,<1", "google-genai>=1,<2"]

[project.scripts]
honest-agent-mcp = "honest_agent.interfaces.mcp_server:serve_stdio"
honest-agent = "honest_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["honest_agent"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
